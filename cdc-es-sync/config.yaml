# cdc-es-sync configuration. ${VAR} and ${VAR:default} are read from the environment or .env.

kafka:
  bootstrap_servers: "${KAFKA_BOOTSTRAP:10.11.200.109:9222}"
  group_id: "${CDC_GROUP:cdc-es-sync}"
  topic_pattern: '^emob\.EMOB\..*'      # one Debezium topic per table: <prefix>.<SCHEMA>.<TABLE>
  auto_offset_reset: "${CDC_OFFSET_RESET:earliest}"   # first start of this group reads everything still in the topics
  dlq_topic: cdc.es-sync.dlq
  session_timeout_ms: 45000
  max_poll_interval_ms: 1800000         # a very large fan-out rebuild may run for minutes between polls

batch:
  max_events: 500
  max_wait_seconds: 1.0                 # collect events for up to this long, then process them as one batch

oracle:
  user: "${ORACLE_USER}"
  password: "${ORACLE_PASSWORD}"
  # ENABLE=BROKEN turns on TCP keepalive so a dead connection is noticed.
  dsn: "${ORACLE_DSN:(DESCRIPTION=(ENABLE=BROKEN)(RETRY_COUNT=3)(RETRY_DELAY=5)(TRANSPORT_CONNECT_TIMEOUT=10)(CONNECT_TIMEOUT=30)(ADDRESS=(PROTOCOL=TCP)(HOST=10.11.200.37)(PORT=1521))(CONNECT_DATA=(SERVICE_NAME=emob)))}"
  schema: EMOB
  pool_min: 1
  pool_max: 4
  fetch_array_size: 1000
  call_timeout_ms: 300000
  timezone: Asia/Dhaka                  # Oracle DATE has no zone; the dev database runs at +06:00

elasticsearch:
  targets:
    default:
      hosts: ["${ES_URL:http://10.11.200.109:9200}"]
      request_timeout: 120

sync:
  chunk_size: 500                       # keys per Oracle round trip (IN lists stay far below the 1000 limit)
  bulk_max_actions: 1000
  max_fanout: 50000                     # above this many keys from one change: warn and throttle between chunks
  throttle_ms: 200
  retry_max_backoff_seconds: 30
  nested_date_offset: "+06:00"          # added to dates inside JSON columns, as the Logstash pipelines do

observability:
  http_port: "${CDC_HTTP_PORT:9108}"    # /metrics and /health
  health_stale_seconds: 120
  log_level: INFO
  log_file: logs/cdc-es-sync.log
  dlq_file_dir: dlq                     # fallback when the DLQ topic cannot be written

startup_checks:
  fail_on_missing_logging: true         # every column a mapping reads must be in a supplemental log group


# =================================================================================================
# One entry per Elasticsearch index.
#
#   sql_file / key_columns / key_filter / doc_id   the Logstash query, unchanged, and how a document is identified.
#                                                  key_columns are columns of the query result (lower case);
#                                                  key_filter are the matching SQL expressions in the query.
#
#   sources: for every table the query reads, which of its columns feed which document fields.
#     One entry says how the affected documents are found:
#       direct: [COLS]       the changed row IS the document; names the event columns forming the key
#       sql + params         a lookup query returning the affected document keys (same column order as key_columns);
#                            :NAME binds are filled from the event columns named in params
#     and what each column does when it changes (columns:)
#       COLUMN: same         refresh the document field with the same (lower case) name
#       COLUMN: [f1, f2]     refresh these document fields
#       COLUMN: rebuild      key or join column: rebuild the whole document (and delete the old one if the key moved)
#     join: inner | outer    set on the entry for a table in the query's top-level FROM list. Inserting or deleting
#                            a row of an inner-join table creates or removes the document, so it is rebuilt whole.
#
# An update event is compared before/after: entries whose listed columns did not change do nothing. For the rest only
# the named fields are updated in Elasticsearch, with the CURRENT values read from Oracle (never the event's values), so
# replays and out-of-order events are harmless.
#
# `python -m cdc_es_sync check` audits this against the SQL: every column the query reads must be listed here, with
# every field it feeds, and nothing listed here may be a column the query does not read.
# Every event column used in direct/params is in your existing supplemental log groups (checked at start-up).
# =================================================================================================
indices:

  # ===============================================================================================
  customer_data:
    target: default
    es_index: customer_data
    sql_file: sql/customer_data.sql
    key_columns: [{col: ac_no, type: str}]
    key_filter: ["A.AC_NO"]
    doc_id: "{ac_no}"
    timestamp_field: create_date
    json_columns: [doc, address, operator, nominee]
    nested_date_fields:
      doc: [issue_date, expire_date, create_date]
      address: [create_date]
      operator: [inactive_date, create_date]
      nominee: [dob]
    etl_pipeline: cdc_customer_data

    sources:
      MB_ACCOUNT_MST:
        - join: inner
          direct: [AC_NO]
          columns:
            AC_NO: rebuild
            AC_ID: rebuild
            CUST_NO: rebuild
            AC_TYPE_ID: rebuild
            POINT_ID: rebuild
            BRANCH_CODE: same
            AC_TITLE: same
            OPEN_DATE: same
            CLOSE_DATE: same
            ALLTRN: same
            SECTOR_CODE: same
            SECURITY_CODE: same
            ECONOMY_CODE: same
            COMP_TYPE: same
            DEBIT_ENABLE_BY: same
            DEBIT_ENABLE_DATE: same
            INITIAL_AMT: same
            AC_STATUS: same
            CREATE_BY: [ac_create_by]
            CREATE_DATE: same
            FINAL_CHECK: same
            FINAL_CHECK_DATE: same
            AC_NATURE: [ac_nature, account_nature]
            OPR_INS: [opr_ins, operating_ins]
            CLOSE_BY: same
            LIEN_MARK: same
            EKYC_TYPE: same

      MB_CUSTOMER_MST:
        - join: inner                  # the customer's own accounts
          params: {CUST_NO: int}
          sql: >-
            SELECT a.ac_no FROM emob.mb_account_mst a
            WHERE a.cust_no = :CUST_NO
          columns:
            CUST_NO: rebuild
            AGENT_POINT_ID: rebuild
            CUST_CODE: same
            CUST_TYPE: [customer_type, cust_type]
            FIRST_NAME: same
            LAST_NAME: same
            FATHER_NAME: same
            MOTHER_NAME: same
            CUST_DOB: same
            GENDER: [gendr, gender]
            MARITUAL_STATUS: [mar_status, maritual_status]
            SPOUSE_NAME: same
            NO_OF_CHILDREN: same
            AML_STS: same
            TOKEN_NO: same
            AML_SENDING_DATE: same
            NO_OF_DEPENDANT: same
            MAIL_ID: same
            OTHER_BANK: same
            OTHER_BANK_ACC_NO: same
            INCOME_PERSON: same
            INCOME_MALE: same
            INCOME_FEMALE: same
            RELATION_WITH_GUARDIAN: same
            CHECK_BY: same
            CHECK_DATE: same
            REMARK: same
            SON: same
            DAUGHTER: same
            MOBILE_NO: same
            RELIGIOUS_CODE: same
            OCCUPATION_CODE: [occupation_code, occupation]
            ANNUAL_INCOME: same
            CUST_STATUS: same
            MEDIA: same
            LIVE_PERIOD: same
            HOME_TYPE: same
            LAST_EDUCATION: [last_education, education]
            FAMILY_GUARDIAN: same
            CREATE_BY: same
            REVIEW_STATUS: same
            AGN_TYPE: same
            REF_AGN: same
        - params: {CUST_NO: int}       # accounts where this customer is an operator (name shown in OPERATOR)
          sql: >-
            SELECT a.ac_no FROM emob.mb_account_operator op
            JOIN emob.mb_account_mst a ON a.ac_id = op.ac_id
            WHERE op.cust_no = :CUST_NO
          columns:
            CUST_NO: [operator]
            FIRST_NAME: [operator]
            LAST_NAME: [operator]

      MB_DOCUMENT_MST:
        - params: {CUST_NO: int}
          sql: >-
            SELECT a.ac_no FROM emob.mb_account_mst a
            WHERE a.cust_no = :CUST_NO
          columns:
            CUST_NO: [doc]
            DOCUMENT_ID: [doc]
            DOCUMENT_TYPE: [doc]
            DOCMENT_NO: [doc]
            ISSUE_DATE: [doc]
            ISSUE_PLACE: [doc]
            EXPIRE_DATE: [doc]
            CREATE_BY: [doc]
            CREATE_DATE: [doc]

      MB_ADDRESS_MST:
        - params: {REF_NO: int}
          sql: >-
            SELECT a.ac_no FROM emob.mb_account_mst a
            WHERE a.cust_no = :REF_NO
          columns:
            REF_NO: [address]
            ADDRESS_ID: [address]
            ADDRESS_TYPE: [address]
            DISTRICT_CODE: [address]
            UPAZILA_CODE: [address]
            UNION_CODE: [address]
            POST_CODE: [address]
            VILLAGE: [address]
            WARD_NO: [address]
            ROAD_NO: [address]
            HOLDING_NO: [address]
            CREATE_DATE: [address]
            CREATE_BY: [address]

      MB_ACCOUNT_OPERATOR:
        - params: {AC_ID: int}
          sql: >-
            SELECT a.ac_no FROM emob.mb_account_mst a
            WHERE a.ac_id = :AC_ID
          columns:
            AC_ID: [operator]
            CUST_NO: [operator]
            STATUS: [operator]
            CREATE_BY: [operator]
            INACTIVE_BY: [operator]
            INACTIVE_DATE: [operator]
            CREATE_DATE: [operator]

      NOMINEE_MST:
        - params: {AC_ID: int}
          sql: >-
            SELECT a.ac_no FROM emob.mb_account_mst a
            WHERE a.ac_id = :AC_ID
          columns:
            AC_ID: [nominee]
            NOMINEE_ID: [nominee]
            NOMINEE_NAME: [nominee]
            FATHER_NAME: [nominee]
            MOTHER_NAME: [nominee]
            RELATION: [nominee]
            NOM_PERCENT: [nominee]
            NOM_TYPE: [nominee]
            DOCMENT_NO: [nominee]
            DOB: [nominee]
            DOCUMENT_TYPE: [nominee]

      MB_PRODUCT_MST:
        - join: inner
          params: {AC_TYPE_ID: int}
          sql: >-
            SELECT a.ac_no FROM emob.mb_account_mst a
            WHERE a.ac_type_id = :AC_TYPE_ID
          columns:
            AC_TYPE_ID: rebuild
            FULL_DESC: same
            SHORT_DESC: same
            DEP_NATURE: same
            AC_TYPE: same
            NATURE: same

      # The query joins the point through the account point AND the customer agent point (superset on purpose).
      ST_AGENT_POINT:
        - join: outer
          params: {POINT_ID: int}
          sql: >-
            SELECT a.ac_no FROM emob.mb_account_mst a
            JOIN emob.mb_customer_mst c ON c.cust_no = a.cust_no
            WHERE a.point_id = :POINT_ID OR c.agent_point_id = :POINT_ID
          columns:
            POINT_ID: rebuild
            POINT_NAME: same
            AREA_NAME: same
            POINT_CATEGORY_ID: [point_category]
            LOCATION_TYPE: same

      ST_POINT_CATEGORY:
        - params: {POINT_CATEGORY_ID: int}
          sql: >-
            SELECT a.ac_no FROM emob.mb_account_mst a
            JOIN emob.mb_customer_mst c ON c.cust_no = a.cust_no
            JOIN emob.st_agent_point f ON f.point_id = a.point_id OR f.point_id = c.agent_point_id
            WHERE f.point_category_id = :POINT_CATEGORY_ID
          columns:
            POINT_CATEGORY_ID: [point_category]
            CATEGORY_NAME: [point_category]

      DISTRICT_INFO:                   # district name inside the ADDRESS array
        - params: {DISTRICT_CODE: str}
          sql: >-
            SELECT a.ac_no FROM emob.mb_address_mst ad
            JOIN emob.mb_account_mst a ON a.cust_no = ad.ref_no
            WHERE ad.district_code = :DISTRICT_CODE
          columns:
            DISTRICT_CODE: [address]
            DISTRICT_NAME: [address]

      UPAZILA_INFO:
        - params: {DISTRICT_CODE: str, UPAZILA_CODE: str}
          sql: >-
            SELECT a.ac_no FROM emob.mb_address_mst ad
            JOIN emob.mb_account_mst a ON a.cust_no = ad.ref_no
            WHERE ad.district_code = :DISTRICT_CODE AND ad.upazila_code = :UPAZILA_CODE
          columns:
            DISTRICT_CODE: [address]
            UPAZILA_CODE: [address]
            UPAZILA_NAME: [address]

      UNION_INFO:
        - params: {DISTRICT_CODE: str, UPAZILA_CODE: str, UNION_CODE: str}
          sql: >-
            SELECT a.ac_no FROM emob.mb_address_mst ad
            JOIN emob.mb_account_mst a ON a.cust_no = ad.ref_no
            WHERE ad.district_code = :DISTRICT_CODE AND ad.upazila_code = :UPAZILA_CODE
              AND ad.union_code = :UNION_CODE
          columns:
            DISTRICT_CODE: [address]
            UPAZILA_CODE: [address]
            UNION_CODE: [address]
            UNION_NAME: [address]

      STCODMAS:                        # occupation (OCC) and education (EDT) text of the customer
        - params: {HARCOD: str, SOFCOD: str}
          sql: >-
            SELECT a.ac_no FROM emob.mb_account_mst a
            JOIN emob.mb_customer_mst c ON c.cust_no = a.cust_no
            WHERE (:HARCOD = 'OCC' AND c.occupation_code = :SOFCOD)
               OR (:HARCOD = 'EDT' AND c.last_education = :SOFCOD)
          columns:
            HARCOD: [occupation, education]
            SOFCOD: [occupation, education]
            CODDES: [occupation, education]

      ST_OPERATING_INSTRUCTION:
        - params: {OPR_INS: str}
          sql: >-
            SELECT a.ac_no FROM emob.mb_account_mst a
            WHERE a.opr_ins = :OPR_INS
          columns:
            OPR_INS: [operating_ins]
            INS_DESC: [operating_ins]

  # ===============================================================================================
  ac_balance_data:
    target: default
    es_index: ac_balance_data
    sql_file: sql/ac_balance_data.sql
    key_columns: [{col: ac_id, type: int}, {col: balance_date, type: date}]
    key_filter: ["B.AC_ID", "B.VALUE_DATE"]
    doc_id: "{ac_id}_{balance_date}"
    timestamp_field: balance_date
    json_columns: []
    nested_date_fields: {}
    etl_pipeline: cdc_ac_balance_data

    sources:
      MB_ACCOUNT_DAILY_BALANCE:
        - join: inner
          direct: [AC_ID, VALUE_DATE]
          columns:
            AC_ID: rebuild
            VALUE_DATE: rebuild
            BALANCE: same

      MB_ACCOUNT_MST:
        - join: inner
          params: {AC_ID: int}
          sql: >-
            SELECT b.ac_id, b.value_date FROM emob.mb_account_daily_balance b
            WHERE b.ac_id = :AC_ID
          columns:
            AC_ID: rebuild
            CUST_NO: rebuild
            AC_TYPE_ID: rebuild
            POINT_ID: rebuild
            AC_NO: same
            AC_TITLE: same
            OPEN_DATE: same
            CREATE_BY: same
            CREATE_DATE: same

      MB_CUSTOMER_MST:
        - join: inner
          params: {CUST_NO: int}
          sql: >-
            SELECT b.ac_id, b.value_date FROM emob.mb_account_daily_balance b
            JOIN emob.mb_account_mst a ON a.ac_id = b.ac_id
            WHERE a.cust_no = :CUST_NO
          columns:
            CUST_NO: rebuild
            CUST_CODE: same
            CUST_TYPE: same
            CUST_DOB: [cust_dob, age]
            GENDER: same
            MARITUAL_STATUS: [mar_status]
            OCCUPATION_CODE: [occupation]
            LAST_EDUCATION: [education]

      MB_PRODUCT_MST:
        - join: inner
          params: {AC_TYPE_ID: int}
          sql: >-
            SELECT b.ac_id, b.value_date FROM emob.mb_account_daily_balance b
            JOIN emob.mb_account_mst a ON a.ac_id = b.ac_id
            WHERE a.ac_type_id = :AC_TYPE_ID
          columns:
            AC_TYPE_ID: rebuild
            FULL_DESC: [product]
            DEP_NATURE: same

      ST_AGENT_POINT:
        - join: outer
          params: {POINT_ID: int}
          sql: >-
            SELECT b.ac_id, b.value_date FROM emob.mb_account_daily_balance b
            JOIN emob.mb_account_mst a ON a.ac_id = b.ac_id
            WHERE a.point_id = :POINT_ID
          columns:
            POINT_ID: rebuild
            POINT_NAME: same
            POINT_CATEGORY_ID: [point_category]
            LOCATION_TYPE: same
            DISTRICT_CODE: [district]

      ST_POINT_CATEGORY:
        - params: {POINT_CATEGORY_ID: int}
          sql: >-
            SELECT b.ac_id, b.value_date FROM emob.mb_account_daily_balance b
            JOIN emob.mb_account_mst a ON a.ac_id = b.ac_id
            JOIN emob.st_agent_point pt ON pt.point_id = a.point_id
            WHERE pt.point_category_id = :POINT_CATEGORY_ID
          columns:
            POINT_CATEGORY_ID: [point_category]
            CATEGORY_NAME: [point_category]

      DISTRICT_INFO:                   # district name of the account point
        - params: {DISTRICT_CODE: str}
          sql: >-
            SELECT b.ac_id, b.value_date FROM emob.mb_account_daily_balance b
            JOIN emob.mb_account_mst a ON a.ac_id = b.ac_id
            JOIN emob.st_agent_point pt ON pt.point_id = a.point_id
            WHERE pt.district_code = :DISTRICT_CODE
          columns:
            DISTRICT_CODE: [district]
            DISTRICT_NAME: [district]

      STCODMAS:
        - params: {HARCOD: str, SOFCOD: str}
          sql: >-
            SELECT b.ac_id, b.value_date FROM emob.mb_account_daily_balance b
            JOIN emob.mb_account_mst a ON a.ac_id = b.ac_id
            JOIN emob.mb_customer_mst c ON c.cust_no = a.cust_no
            WHERE (:HARCOD = 'OCC' AND c.occupation_code = :SOFCOD)
               OR (:HARCOD = 'EDT' AND c.last_education = :SOFCOD)
          columns:
            HARCOD: [occupation, education]
            SOFCOD: [occupation, education]
            CODDES: [occupation, education]

  # ===============================================================================================
  transaction_history:
    target: default
    es_index: transaction_history_
    sql_file: sql/transaction_history.sql
    key_columns: [{col: tran_id, type: int}]
    key_filter: ["a.TRAN_ID"]
    doc_id: "{tran_id}"
    timestamp_field: create_date
    json_columns: []
    nested_date_fields: {}
    etl_pipeline: cdc_transaction_history

    # The Logstash load reads account, customer, product, point and code values as they are when it runs, so
    # these documents carry the CURRENT values. A change to any of them updates the affected fields of every
    # transaction that uses it (only those fields, by document id).
    sources:
      MB_TRANSACTION_DTL:
        - join: inner
          direct: [TRAN_ID]
          columns:
            TRAN_ID: rebuild
            AC_ID: rebuild
            TRAN_CODE: rebuild
            TRAN_POINT_ID: rebuild       # drives about 15 point fields
            BAL_FLAG: same
            BRANCH_CODE: same
            CHARGE_FLAG: same
            CHEQUE_DATE: same
            CHEQUE_NO: same
            CHEQUE_SERISE: same
            CREATE_BY: same
            CREATE_DATE: [tran_time, create_date]
            DOC_DATE: same
            DOC_NUM: same
            DRCR_CODE: [drcr_code, dr_cr]
            GLAC_ID: same
            NARATION: same
            REF_DOC_NO: same
            REV_TRAN_ID: same
            SL_NUM: same
            TRANS_BRANCH_CODE: same
            TRAN_AMT_LC: [amount]
            TRAN_TYPE: [tran_type, type_desc]
            VALUE_DATE: same

      MB_ACCOUNT_MST:
        - join: inner
          params: {AC_ID: int}
          sql: >-
            SELECT t.tran_id FROM emob.mb_transaction_dtl t
            WHERE t.ac_id = :AC_ID
          columns:
            AC_ID: rebuild
            AC_TYPE_ID: rebuild
            AC_NO: same
            AC_STATUS: same
            AC_TITLE: same
            ALLTRN: same
            CLOSE_DATE: same
            EKYC_TYPE: same
            FINAL_CHECK: same
            FINAL_CHECK_BY: same
            FINAL_CHECK_DATE: same
            INI_CHECK: same
            INI_CHECK_BY: same
            INI_CHECK_DATE: same
            OPEN_DATE: same
            OPR_INS: same
            SECTOR_CODE: same
            VERIFY_BY: same
            VERIFY_DATE: same
            VERIFY_STATUS: same
            CUST_NO: [cust_no, occupation, cust_status, cust_type, ref_agn, mobile_no, mobile_no2,
                      aml_token_no, aml_sending_date, aml_status_update_date, aml_sts]
            POINT_ID: [ac_point_id, ac_point_name, ac_point_category_id, ac_point_category, ac_point_district]

      MB_CUSTOMER_MST:
        - params: {CUST_NO: int}       # transactions of the customer's accounts
          sql: >-
            SELECT t.tran_id FROM emob.mb_transaction_dtl t
            JOIN emob.mb_account_mst a ON a.ac_id = t.ac_id
            WHERE a.cust_no = :CUST_NO
          columns:
            CUST_NO: [occupation, cust_status, cust_type, ref_agn, mobile_no, mobile_no2,
                      aml_token_no, aml_sending_date, aml_status_update_date, aml_sts]
            CUST_STATUS: same
            CUST_TYPE: same
            REF_AGN: same
            MOBILE_NO: same
            MOBILE_NO2: same
            TOKEN_NO: [aml_token_no]
            AML_SENDING_DATE: same
            AML_STATUS_UPDATE_DATE: same
            AML_STS: same
            OCCUPATION_CODE: [occupation]
        - params: {CUST_NO: int}       # transactions at points whose agent is this customer (AGENT_NAME)
          sql: >-
            SELECT t.tran_id FROM emob.mb_transaction_dtl t
            JOIN emob.st_agent_point p ON p.point_id = t.tran_point_id
            WHERE p.agent_id = :CUST_NO
          columns:
            CUST_NO: [agent_name]
            FIRST_NAME: [agent_name]
            LAST_NAME: [agent_name]

      MB_PRODUCT_MST:
        - join: inner
          params: {AC_TYPE_ID: int}
          sql: >-
            SELECT t.tran_id FROM emob.mb_transaction_dtl t
            JOIN emob.mb_account_mst a ON a.ac_id = t.ac_id
            WHERE a.ac_type_id = :AC_TYPE_ID
          columns:
            AC_TYPE_ID: rebuild
            AC_PREFIX: same
            AC_TYPE: same
            DEP_NATURE: same
            FULL_DESC: [product_name]
            SHORT_DESC: [short_name]

      ST_TRANSACTION_CODE:
        - join: inner
          params: {TRAN_CODE: str}
          sql: >-
            SELECT t.tran_id FROM emob.mb_transaction_dtl t
            WHERE t.tran_code = :TRAN_CODE
          columns:
            TRAN_CODE: rebuild
            TRAN_DESC: same

      ST_SECTOR_CODE:
        - params: {SRLNO: str}
          sql: >-
            SELECT t.tran_id FROM emob.mb_transaction_dtl t
            JOIN emob.mb_account_mst a ON a.ac_id = t.ac_id
            WHERE a.sector_code = :SRLNO
          columns:
            SRLNO: [sector_code]
            SECTOR_CODE: [sector_code]
            SECTOR_DESC: [sector_code]

      ST_AGENT_POINT:
        - params: {POINT_ID: int}      # the point of the transaction's ACCOUNT (AC_POINT_*)
          sql: >-
            SELECT t.tran_id FROM emob.mb_transaction_dtl t
            JOIN emob.mb_account_mst a ON a.ac_id = t.ac_id
            WHERE a.point_id = :POINT_ID
          columns:
            POINT_ID: rebuild
            POINT_NAME: [ac_point_name]
            POINT_CATEGORY_ID: [ac_point_category_id, ac_point_category]
            DISTRICT_CODE: [ac_point_district]
        - params: {POINT_ID: int}      # the point where the transaction took place
          sql: >-
            SELECT t.tran_id FROM emob.mb_transaction_dtl t
            WHERE t.tran_point_id = :POINT_ID
          columns:
            POINT_ID: rebuild
            AGENT_ID: [agent_id, agent_name]
            AGENT_MAIL_ID: same
            AREA_NAME: same
            DISTRICT_CODE: [point_district, point_upazilla, point_union]
            LATITUDE: [lat]
            LOCATION_TYPE: [loc_type, location_type]
            LONGITUDE: [lng]
            POINT_CATEGORY_ID: [point_category]
            POINT_NAME: [point_name]
            POST_CODE: same
            STATUS: same
            UNION_CODE: [point_union]
            UPAZILA_CODE: [point_upazilla, point_union]

      ST_POINT_CATEGORY:
        - params: {POINT_CATEGORY_ID: int}      # category of the account point
          sql: >-
            SELECT t.tran_id FROM emob.mb_transaction_dtl t
            JOIN emob.mb_account_mst a ON a.ac_id = t.ac_id
            JOIN emob.st_agent_point p ON p.point_id = a.point_id
            WHERE p.point_category_id = :POINT_CATEGORY_ID
          columns:
            POINT_CATEGORY_ID: [ac_point_category_id, ac_point_category]
            CATEGORY_NAME: [ac_point_category]
        - params: {POINT_CATEGORY_ID: int}      # category of the transaction point
          sql: >-
            SELECT t.tran_id FROM emob.mb_transaction_dtl t
            JOIN emob.st_agent_point p ON p.point_id = t.tran_point_id
            WHERE p.point_category_id = :POINT_CATEGORY_ID
          columns:
            POINT_CATEGORY_ID: [point_category]
            CATEGORY_NAME: [point_category]

      DISTRICT_INFO:
        - params: {DISTRICT_CODE: str}          # district of the account point
          sql: >-
            SELECT t.tran_id FROM emob.mb_transaction_dtl t
            JOIN emob.mb_account_mst a ON a.ac_id = t.ac_id
            JOIN emob.st_agent_point p ON p.point_id = a.point_id
            WHERE p.district_code = :DISTRICT_CODE
          columns:
            DISTRICT_CODE: [ac_point_district]
            DISTRICT_NAME: [ac_point_district]
        - params: {DISTRICT_CODE: str}          # district of the transaction point
          sql: >-
            SELECT t.tran_id FROM emob.mb_transaction_dtl t
            JOIN emob.st_agent_point p ON p.point_id = t.tran_point_id
            WHERE p.district_code = :DISTRICT_CODE
          columns:
            DISTRICT_CODE: [point_district]
            DISTRICT_NAME: [point_district]

      UPAZILA_INFO:
        - params: {DISTRICT_CODE: str, UPAZILA_CODE: str}
          sql: >-
            SELECT t.tran_id FROM emob.mb_transaction_dtl t
            JOIN emob.st_agent_point p ON p.point_id = t.tran_point_id
            WHERE p.district_code = :DISTRICT_CODE AND p.upazila_code = :UPAZILA_CODE
          columns:
            DISTRICT_CODE: [point_upazilla]
            UPAZILA_CODE: [point_upazilla]
            UPAZILA_NAME: [point_upazilla]

      UNION_INFO:
        - params: {DISTRICT_CODE: str, UPAZILA_CODE: str, UNION_CODE: str}
          sql: >-
            SELECT t.tran_id FROM emob.mb_transaction_dtl t
            JOIN emob.st_agent_point p ON p.point_id = t.tran_point_id
            WHERE p.district_code = :DISTRICT_CODE AND p.upazila_code = :UPAZILA_CODE
              AND p.union_code = :UNION_CODE
          columns:
            DISTRICT_CODE: [point_union]
            UPAZILA_CODE: [point_union]
            UNION_CODE: [point_union]
            UNION_NAME: [point_union]

      STCODMAS:                        # occupation text only (HARCOD = 'OCC')
        - params: {HARCOD: str, SOFCOD: str}
          sql: >-
            SELECT t.tran_id FROM emob.mb_transaction_dtl t
            JOIN emob.mb_account_mst a ON a.ac_id = t.ac_id
            JOIN emob.mb_customer_mst c ON c.cust_no = a.cust_no
            WHERE :HARCOD = 'OCC' AND c.occupation_code = :SOFCOD
          columns:
            HARCOD: [occupation]
            SOFCOD: [occupation]
            CODDES: [occupation]
