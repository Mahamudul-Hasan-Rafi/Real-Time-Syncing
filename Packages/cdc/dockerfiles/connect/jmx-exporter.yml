lowercaseOutputName: true
lowercaseOutputLabelNames: true
rules:
  # Debezium: snapshot / streaming metrics (e.g. MilliSecondsBehindSource, QueueRemainingCapacity)
  - pattern: 'debezium.([^:]+)<type=connector-metrics, context=([^,]+), server=([^,>]+)(?:, task=([^>]+))?><>([^:]+)'
    name: debezium_metrics_$5
    type: GAUGE
    labels: { plugin: "$1", context: "$2", name: "$3", task: "$4" }
  # Kafka Connect worker / connector / task metrics
  - pattern: 'kafka.connect<type=connector-task-metrics, connector=([^,]+), task=([^>]+)><>(running-ratio|pause-ratio|batch-size-avg|batch-size-max|offset-commit-avg-time-ms|offset-commit-failure-percentage)'
    name: kafka_connect_task_$3
    type: GAUGE
    labels: { connector: "$1", task: "$2" }
  - pattern: 'kafka.connect<type=source-task-metrics, connector=([^,]+), task=([^>]+)><>(source-record-poll-total|source-record-write-total|source-record-active-count|poll-batch-avg-time-ms)'
    name: kafka_connect_source_$3
    type: GAUGE
    labels: { connector: "$1", task: "$2" }
  - pattern: 'kafka.connect<type=connect-worker-metrics><>(connector-count|task-count|connector-startup-failure-total|task-startup-failure-total)'
    name: kafka_connect_worker_$1
    type: GAUGE
  - pattern: 'kafka.connect<type=connect-worker-metrics, connector=([^>]+)><>(connector-total-task-count|connector-running-task-count|connector-failed-task-count|connector-paused-task-count)'
    name: kafka_connect_worker_$2
    type: GAUGE
    labels: { connector: "$1" }
