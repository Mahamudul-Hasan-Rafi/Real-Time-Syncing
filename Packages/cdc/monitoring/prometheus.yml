global:
  scrape_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: kafka
    static_configs:
      - targets: ["kafka-exporter:9308"]
  - job_name: kafka-jmx
    static_configs:
      - targets: ["kafka:9404"]
  - job_name: connect-jmx
    static_configs:
      - targets: ["connect:9404"]
  - job_name: containers
    static_configs:
      - targets: ["cadvisor:8080"]
  # Oracle: archive log storage, recovery area, database state (see monitoring/oracle/custom-metrics.toml)
  - job_name: oracle
    scrape_interval: 60s
    scrape_timeout: 30s
    static_configs:
      - targets: ["oracle-exporter:9161"]
  # Target apply: cdc-es-sync runs from its own compose project, so it is reached through the host's published port
  - job_name: cdc-es-sync
    static_configs:
      - targets: ["host.docker.internal:9108"]
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
