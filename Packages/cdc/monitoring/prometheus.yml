global:
  scrape_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  # Topics, partitions and consumer group lag
  - job_name: kafka
    static_configs:
      - targets: ["kafka-exporter:9308"]
  # Broker and KRaft controller JMX (dockerfiles/kafka/jmx-exporter.yml)
  - job_name: kafka-jmx
    static_configs:
      - targets: ["kafka:9404"]
  # Kafka Connect workers and every Debezium engine they run (dockerfiles/connect/jmx-exporter.yml). Add each worker.
  - job_name: connect-jmx
    static_configs:
      - targets: ["connect:9404"]
  # Automatic connector recovery: restarts, offset resets, connector condition
  - job_name: connect-guardian
    static_configs:
      - targets: ["connect-guardian:9405"]
  - job_name: containers
    scrape_interval: 30s
    static_configs:
      - targets: ["cadvisor:8080"]
  # Host CPU, memory, swap and disk
  - job_name: node
    scrape_interval: 30s
    static_configs:
      - targets: ["node-exporter:9100"]
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
