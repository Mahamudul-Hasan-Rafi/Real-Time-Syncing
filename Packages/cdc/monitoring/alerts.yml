groups:
  - name: cdc-oracle
    rules:
      - alert: OracleExporterDown
        expr: oracledb_up == 0 or absent(oracledb_up)
        for: 2m
        labels: { severity: critical, component: oracle }
        annotations: { summary: "Cannot read Oracle metrics", description: "oracle-exporter cannot connect to Oracle, or is not running. Archive log storage is not being monitored." }

      - alert: ArchiveDestinationInvalid
        expr: min(oracledb_archive_dest_valid) == 0
        for: 2m
        labels: { severity: critical, component: oracle }
        annotations: { summary: "Archive destination is not VALID", description: "A LOCAL archive destination has an error (for example ORA-16032). Debezium cannot start, and Oracle may stop accepting changes when redo logs cannot be archived." }

      - alert: ArchivelogModeOff
        expr: oracledb_db_archivelog == 0
        for: 1m
        labels: { severity: critical, component: oracle }
        annotations: { summary: "Database is not in ARCHIVELOG mode", description: "Debezium LogMiner CDC needs ARCHIVELOG mode." }

      - alert: FraUsageHigh
        expr: oracledb_fra_used_bytes / oracledb_fra_limit_bytes > 0.80
        for: 10m
        labels: { severity: warning, component: archive-storage }
        annotations: { summary: "Recovery area above 80% ({{ $value | humanizePercentage }})", description: "Archive logs fill the recovery area. Check RMAN deletion and db_recovery_file_dest_size." }

      - alert: FraUsageCritical
        expr: oracledb_fra_used_bytes / oracledb_fra_limit_bytes > 0.90
        for: 5m
        labels: { severity: critical, component: archive-storage }
        annotations: { summary: "Recovery area above 90% ({{ $value | humanizePercentage }})", description: "When it is full, Oracle stops archiving and the database can hang. Free space or enlarge the recovery area now." }

      - alert: FraFullWithin6Hours
        expr: (oracledb_fra_limit_bytes - oracledb_fra_used_bytes + oracledb_fra_reclaimable_bytes) / clamp_min(oracledb_archive_log_bytes_last_hour, 1) < 6
        for: 15m
        labels: { severity: warning, component: archive-storage }
        annotations: { summary: "Recovery area full in about {{ $value | humanize }} hours", description: "At the archive log rate of the last hour, free plus reclaimable space runs out within 6 hours." }

      - alert: ConnectorBehindOldestArchiveLog
        expr: debezium_metrics_offsetscn{context="streaming"} < scalar(oracledb_archive_log_oldest_scn) and on() (oracledb_archive_log_oldest_scn > 0)
        for: 5m
        labels: { severity: critical, component: archive-storage }
        annotations: { summary: "Connector position is older than the oldest archive log", description: "The archive log holding the connector offset was deleted. After a restart the connector cannot resume (the 'no longer available on the server' error) and needs an offset reset." }

  - name: cdc-pipeline
    rules:
      - alert: ConnectorTaskNotRunning
        expr: kafka_connect_worker_connector_failed_task_count > 0 or absent(kafka_connect_worker_connector_running_task_count{connector="emob-oracle-cdc"}) or kafka_connect_worker_connector_running_task_count{connector="emob-oracle-cdc"} < 1
        for: 2m
        labels: { severity: critical, component: debezium }
        annotations: { summary: "Debezium task is not running", description: "Task FAILED or missing. Check GET /connectors/emob-oracle-cdc/status and the Connect log, then restart the task." }

      - alert: DebeziumDisconnected
        expr: debezium_metrics_connected{context="streaming"} == 0
        for: 2m
        labels: { severity: critical, component: debezium }
        annotations: { summary: "Debezium lost its Oracle connection" }

      - alert: CdcLagHigh
        expr: debezium_metrics_millisecondsbehindsource{context="streaming"} > 30000
        for: 5m
        labels: { severity: warning, component: debezium }
        annotations: { summary: "Source lag above 30s ({{ $value | humanizeDuration }})", description: "Debezium is behind the Oracle redo stream." }

      - alert: KafkaBrokerDown
        expr: up{job="kafka"} == 0 or kafka_brokers < 1
        for: 1m
        labels: { severity: critical, component: kafka }
        annotations: { summary: "Kafka broker not reachable" }

      - alert: UnderReplicatedPartitions
        expr: sum(kafka_topic_partition_under_replicated_partition) > 0
        for: 5m
        labels: { severity: warning, component: kafka }
        annotations: { summary: "Kafka has under-replicated partitions" }

      - alert: SyncConsumerLagHigh
        expr: sum(cdc_consumer_lag) > 1000
        for: 10m
        labels: { severity: warning, component: target-apply }
        annotations: { summary: "cdc-es-sync is more than 1000 messages behind" }

      - alert: SyncStalled
        expr: (time() - cdc_last_batch_timestamp > 600) and on() (sum(cdc_consumer_lag) > 0)
        for: 5m
        labels: { severity: critical, component: target-apply }
        annotations: { summary: "cdc-es-sync has not committed a batch for 10 minutes while messages are waiting" }

      - alert: SyncErrors
        expr: sum(increase(cdc_errors_total[10m])) > 0 or sum(increase(cdc_dlq_total[10m])) > 0
        labels: { severity: warning, component: target-apply }
        annotations: { summary: "cdc-es-sync reported errors or dead-lettered events" }

      - alert: ScrapeTargetDown
        expr: up == 0
        for: 3m
        labels: { severity: warning, component: monitoring }
        annotations: { summary: "Prometheus cannot scrape {{ $labels.job }} ({{ $labels.instance }})" }
