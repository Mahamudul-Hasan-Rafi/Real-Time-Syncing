# Transaction history
# Target index: transaction_history_    Document ID: tran_id (verified unique on dev)
# Full load: reads once and stops. Re-running is safe because document IDs are deterministic.
# SQL change: removed the CREATE_DATE range filter.

input {
  jdbc {
    id => "jdbc_transaction_history"
    jdbc_driver_library => "D:/Kafka/Packages/cdc/elastic/logstash-8.4.3/logstash-8.4.3/drivers/ojdbc8-21.1.0.0.jar"
    jdbc_driver_class => "Java::oracle.jdbc.driver.OracleDriver"
    # ENABLE=BROKEN turns on TCP keepalive, so a dead database connection is detected during a long read.
    jdbc_connection_string => "${ORACLE_JDBC_URL:jdbc:oracle:thin:@(DESCRIPTION=(ENABLE=BROKEN)(RETRY_COUNT=3)(RETRY_DELAY=5)(TRANSPORT_CONNECT_TIMEOUT=10)(CONNECT_TIMEOUT=30)(ADDRESS=(PROTOCOL=TCP)(HOST=10.11.200.37)(PORT=1521))(CONNECT_DATA=(SERVICE_NAME=emob)))}"
    # Both come from the Logstash keystore.
    jdbc_user => "${ORACLE_USER}"
    jdbc_password => "${ORACLE_PASSWORD}"
    jdbc_validate_connection => true
    connection_retry_attempts => 5
    connection_retry_attempts_wait_time => 30
    # Oracle's driver default is 10 rows per network round trip.
    jdbc_fetch_size => 2000
    # Oracle DATE has no time zone. The dev database session runs at +06:00.
    jdbc_default_timezone => "Asia/Dhaka"
    # No sql_last_value in this query, so there is no run state to keep.
    record_last_run => false
    statement => "SELECT a.TRAN_ID,
       a.branch_code,
       B.AC_TITLE,
       B.OPEN_DATE,
       B.CLOSE_DATE,
       B.ALLTRN,
       B.AC_STATUS,
       B.INI_CHECK,
       B.INI_CHECK_BY,
       B.INI_CHECK_DATE,
       B.FINAL_CHECK,
       B.OPR_INS,
       B.EKYC_TYPE,
       B.VERIFY_BY,
       B.VERIFY_STATUS,
       B.VERIFY_DATE,
       B.FINAL_CHECK_BY,
       B.FINAL_CHECK_DATE,
       a.TRANS_BRANCH_CODE,
       a.SL_NUM,
       a.tran_type,
       TO_CHAR (a.CREATE_DATE, 'HH24:MI:SS')
           TRAN_TIME,
       C.TRAN_DESC,
       A.AC_ID,
       A.BAL_FLAG,
       A.GLAC_ID,
       B.AC_NO,
       B.AC_TYPE_ID,
       B.CUST_NO,
       P.FULL_DESC
           PRODUCT_NAME,
       P.AC_TYPE,
       P.DEP_NATURE,
       P.SHORT_DESC
           SHORT_NAME,
       P.AC_PREFIX,
       A.TRAN_AMT_LC
           AMOUNT,
       DECODE (a.tran_type,
               'CL', 'Clearing',
               'CH', 'Charge',
               'CS', 'Cash',
               'TR', 'Transfer',
               'IN', 'Interest',
               'RV', 'Reverse',
               'JP', 'Journal Posting',
               'JZ', 'Journal Other',
               'Other')
           Type_Desc,
       A.DOC_NUM,
       A.TRAN_POINT_ID,
       A.DOC_DATE,
       a.tran_code,
       A.NARATION,
       a.drcr_code,
       DECODE (A.DRCR_CODE,  'D', 'Debit',  'C', 'Credit')
           DR_CR,
       A.REV_TRAN_ID,
       A.CREATE_DATE,
       A.CREATE_BY,
       A.BAL_FLAG,
       A.TRANS_BRANCH_CODE,
       A.REF_DOC_NO,
       A.CHARGE_FLAG,
       A.VALUE_DATE,
       A.CHEQUE_SERISE,
       A.CHEQUE_NO,
       A.CHEQUE_DATE,
	   B.POINT_ID AC_POINT_ID,
       (SELECT POINT_NAME 
          FROM EMOB.ST_AGENT_POINT
         WHERE POINT_ID = B.POINT_ID)
           AC_POINT_NAME,
       (SELECT Y.POINT_CATEGORY_ID
          FROM EMOB.ST_AGENT_POINT X, EMOB.st_point_category Y
         WHERE     X.POINT_ID = B.POINT_ID
               AND x.point_category_id = y.point_category_id)
           AC_POINT_CATEGORY_ID,     
       (SELECT y.category_name
          FROM EMOB.ST_AGENT_POINT X, EMOB.st_point_category Y
         WHERE     X.POINT_ID = B.POINT_ID
               AND x.point_category_id = y.point_category_id)
           AC_POINT_CATEGORY,
       (SELECT DISTRICT_CODE||'-'||DISTRICT_NAME
          FROM EMOB.DISTRICT_INFO
         WHERE DISTRICT_CODE = (SELECT DISTRICT_CODE
                                  FROM EMOB.ST_AGENT_POINT
                                 WHERE POINT_ID = B.POINT_ID))
           AC_POINT_DISTRICT,
       (SELECT SECTOR_CODE || '-' || SECTOR_DESC
          FROM EMOB.ST_SECTOR_CODE
         WHERE SRLNO = B.SECTOR_CODE)
           SECTOR_CODE,
       (SELECT CODDES
          FROM EMOB.STCODMAS
         WHERE     HARCOD = 'OCC'
               AND SOFCOD = (SELECT OCCUPATION_CODE
                               FROM EMOB.MB_CUSTOMER_MST
                              WHERE CUST_NO = B.CUST_NO))
           OCCUPATION,
       (SELECT DECODE (LOCATION_TYPE,  'U', 'Urban',  'R', 'Rural')
          FROM EMOB.ST_AGENT_POINT
         WHERE POINT_ID = A.TRAN_POINT_ID)
           LOC_TYPE,
        (SELECT AREA_NAME
          FROM EMOB.ST_AGENT_POINT
         WHERE POINT_ID = A.TRAN_POINT_ID)
           AREA_NAME,
            (SELECT LATITUDE
          FROM EMOB.ST_AGENT_POINT
         WHERE POINT_ID = A.TRAN_POINT_ID)
           LAT,
            (SELECT LONGITUDE
          FROM EMOB.ST_AGENT_POINT
         WHERE POINT_ID = A.TRAN_POINT_ID)
           LNG,
          (SELECT POST_CODE
          FROM EMOB.ST_AGENT_POINT
         WHERE POINT_ID = A.TRAN_POINT_ID)
           POST_CODE,
          (SELECT STATUS
          FROM EMOB.ST_AGENT_POINT
         WHERE POINT_ID = A.TRAN_POINT_ID)
           STATUS,
          (SELECT LOCATION_TYPE
          FROM EMOB.ST_AGENT_POINT
         WHERE POINT_ID = A.TRAN_POINT_ID)
           LOCATION_TYPE,
          (SELECT AGENT_ID
          FROM EMOB.ST_AGENT_POINT
         WHERE POINT_ID = A.TRAN_POINT_ID)
           AGENT_ID,
           (SELECT AGENT_MAIL_ID
          FROM EMOB.ST_AGENT_POINT
         WHERE POINT_ID = A.TRAN_POINT_ID)
           AGENT_MAIL_ID,
       (SELECT y.category_name
          FROM EMOB.ST_AGENT_POINT X, EMOB.st_point_category Y
         WHERE     X.POINT_ID = A.TRAN_POINT_ID
               AND x.point_category_id = y.point_category_id)
           POINT_CATEGORY,
       (SELECT POINT_NAME
          FROM EMOB.ST_AGENT_POINT
         WHERE POINT_ID = A.TRAN_POINT_ID)
           POINT_NAME,
       (SELECT DISTRICT_CODE||'-'||DISTRICT_NAME
          FROM EMOB.DISTRICT_INFO
         WHERE DISTRICT_CODE = (SELECT DISTRICT_CODE
                                  FROM EMOB.ST_AGENT_POINT
                                 WHERE POINT_ID = A.TRAN_POINT_ID))
           POINT_DISTRICT,
        (SELECT UPAZILA_CODE||'-'||UPAZILA_NAME
          FROM EMOB.UPAZILA_INFO
         WHERE DISTRICT_CODE = (SELECT DISTRICT_CODE
                                  FROM EMOB.ST_AGENT_POINT
                                 WHERE POINT_ID = A.TRAN_POINT_ID)
           AND UPAZILA_CODE=(SELECT UPAZILA_CODE
                                  FROM EMOB.ST_AGENT_POINT
                                 WHERE POINT_ID = A.TRAN_POINT_ID))
           POINT_UPAZILLA,
          (SELECT UNION_CODE||'-'||UNION_NAME
          FROM EMOB.UNION_INFO
         WHERE DISTRICT_CODE = (SELECT DISTRICT_CODE
                                  FROM EMOB.ST_AGENT_POINT
                                 WHERE POINT_ID = A.TRAN_POINT_ID)
           AND UPAZILA_CODE=(SELECT UPAZILA_CODE
                                  FROM EMOB.ST_AGENT_POINT
                                 WHERE POINT_ID = A.TRAN_POINT_ID)
           AND UNION_CODE=(SELECT UNION_CODE
                                  FROM EMOB.ST_AGENT_POINT
                                 WHERE POINT_ID = A.TRAN_POINT_ID))
           POINT_UNION,
       (SELECT FIRST_NAME || ' ' || LAST_NAME
          FROM EMOB.MB_CUSTOMER_MST X, EMOB.ST_AGENT_POINT Y
         WHERE Y.POINT_ID = A.TRAN_POINT_ID AND x.cust_no = y.agent_id)
           AGENT_NAME,
        (SELECT CUST_STATUS
          FROM EMOB.MB_CUSTOMER_MST X
         WHERE x.cust_no = B.CUST_NO) CUST_STATUS,
        (SELECT CUST_TYPE
          FROM EMOB.MB_CUSTOMER_MST X
         WHERE x.cust_no = B.CUST_NO) CUST_TYPE,
        (SELECT REF_AGN
          FROM EMOB.MB_CUSTOMER_MST X
         WHERE x.cust_no = B.CUST_NO) REF_AGN,
        (SELECT MOBILE_NO
          FROM EMOB.MB_CUSTOMER_MST X
         WHERE x.cust_no = B.CUST_NO) MOBILE_NO,
         (SELECT MOBILE_NO2
          FROM EMOB.MB_CUSTOMER_MST X
         WHERE x.cust_no = B.CUST_NO) MOBILE_NO2,
       (SELECT TOKEN_NO
          FROM EMOB.MB_CUSTOMER_MST X
         WHERE x.cust_no = B.CUST_NO) AML_TOKEN_NO,
         (SELECT AML_SENDING_DATE
          FROM EMOB.MB_CUSTOMER_MST X
         WHERE x.cust_no = B.CUST_NO) AML_SENDING_DATE,
         (SELECT AML_STATUS_UPDATE_DATE
          FROM EMOB.MB_CUSTOMER_MST X
         WHERE x.cust_no = B.CUST_NO) AML_STATUS_UPDATE_DATE,
        (SELECT AML_STS
          FROM EMOB.MB_CUSTOMER_MST X
         WHERE x.cust_no = B.CUST_NO) AML_STS,
       'ABS'
           SRC,
       'C'
           CON_ISL
  FROM EMOB.MB_TRANSACTION_DTL   a,
       EMOB.MB_ACCOUNT_MST       B,
       EMOB.ST_TRANSACTION_CODE  C,
       EMOB.MB_PRODUCT_MST       P
 WHERE     A.AC_ID = B.AC_ID
       AND A.TRAN_CODE = C.TRAN_CODE
       AND B.AC_TYPE_ID = P.AC_TYPE_ID
       AND A.AC_ID IS NOT NULL
       AND A.AC_ID = B.AC_ID"
  }
}

filter {
  mutate {
    id => "lineage_loaded_at"
    copy => { "@timestamp" => "etl_loaded_at" }
  }
  mutate {
    id => "lineage_pipeline"
    add_field => { "etl_pipeline" => "transaction_history" }
    remove_field => ["@version"]
  }

  # Time filter in Kibana follows the business date. Load time stays in etl_loaded_at.
  # The JDBC input already returns a timestamp, so copy it. The date filter ignores non-strings.
  if [create_date] {
    mutate {
      id => "business_timestamp"
      copy => { "create_date" => "@timestamp" }
    }
  }

  # A missing key would otherwise become the literal ID "%{...}" and overwrite one document repeatedly.
  if [tran_id] {
    mutate {
      id => "doc_id"
      add_field => { "[@metadata][doc_id]" => "%{[tran_id]}" }
    }
  } else {
    mutate {
      id => "tag_missing_id"
      add_tag => ["_missing_doc_id"]
    }
  }
}

output {
  if "_missing_doc_id" in [tags] {
    file {
      id => "rejects_transaction_history"
      path => "D:/Kafka/Packages/cdc/elastic/logstash-8.4.3/logstash-8.4.3/rejects/transaction_history.ndjson"
      codec => json_lines
    }
  } else {
    elasticsearch {
      id => "es_transaction_history"
      hosts => ["${ES_HOSTS:http://10.11.200.109:9200}"]
      index => "transaction_history_"
      action => "index"
      document_id => "%{[@metadata][doc_id]}"
      data_stream => false
      ilm_enabled => false
      manage_template => true
      template => "D:/Kafka/Packages/cdc/elastic/logstash-8.4.3/logstash-8.4.3/templates/transaction_history.json"
      template_name => "transaction_history"
      template_overwrite => true
      # A slow bulk on a 2 GB heap should queue, not time out and resend.
      timeout => 120
      retry_max_interval => 30
    }
  }
}
