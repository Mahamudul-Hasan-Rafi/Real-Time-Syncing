# Daily account balances
# Target index: ac_balance_data    Document ID: ac_id + balance_date (natural key, verified unique on dev)
# Full load: reads once and stops. Re-running is safe because document IDs are deterministic.
# SQL change: the table is mb_account_daily_balance on dev. mb_account_daily_balance_test does not exist there.

input {
  jdbc {
    id => "jdbc_ac_balance_data"
    jdbc_driver_library => "${LS_ROOT:.}/drivers/ojdbc8-21.1.0.0.jar"
    jdbc_driver_class => "Java::oracle.jdbc.driver.OracleDriver"
    # ENABLE=BROKEN turns on TCP keepalive, so a dead database connection is detected during a long read.
    jdbc_connection_string => "${ORACLE_JDBC_URL:jdbc:oracle:thin:@(DESCRIPTION=(ENABLE=BROKEN)(RETRY_COUNT=3)(RETRY_DELAY=5)(TRANSPORT_CONNECT_TIMEOUT=10)(CONNECT_TIMEOUT=30)(ADDRESS=(PROTOCOL=TCP)(HOST=10.11.200.37)(PORT=1521))(CONNECT_DATA=(SERVICE_NAME=emob)))}"
    # Both come from the Logstash keystore.
    jdbc_user => "${ORACLE_USER}"
    jdbc_password => "${ORACLE_PASSWORD}"
    jdbc_validate_connection => true
    connection_retry_attempts => 5
    connection_retry_attempts_wait_time => 30
    # Oracle's driver default is 10 rows per network round trip.
    jdbc_fetch_size => 5000
    # Oracle DATE has no time zone. The dev database session runs at +06:00.
    jdbc_default_timezone => "Asia/Dhaka"
    # No sql_last_value in this query, so there is no run state to keep.
    record_last_run => false
    statement => "SELECT B.AC_ID,
       B.BALANCE,
       B.VALUE_DATE AS BALANCE_DATE,
       A.AC_NO,
       A.AC_TITLE,
       A.CUST_NO,
       A.OPEN_DATE,
       A.CREATE_BY,
       A.CREATE_DATE,
       C.CUST_CODE,
       DECODE (C.CUST_TYPE,  'CUS', 'Customer',  'AGN', 'Agent')
           CUST_TYPE,
       c.cust_dob,
       TRUNC (MONTHS_BETWEEN (SYSDATE, c.cust_dob) / 12)
           AGE,
       DECODE (C.GENDER, 'M', 'Male', 'Female')
           GENDER,
       DECODE (c.maritual_status,  'SNG', 'Single',  'MAR', 'Married')
           Mar_status,
       (SELECT CODDES
          FROM EMOB.STCODMAS
         WHERE HARCOD = 'OCC' AND SOFCOD = C.OCCUPATION_CODE)
           OCCUPATION,
       (SELECT CODDES
          FROM EMOB.STCODMAS
         WHERE HARCOD = 'EDT' AND SOFCOD = C.LAST_EDUCATION)
           EDUCATION,
       P.FULL_DESC
           PRODUCT,
       DECODE (P.DEP_NATURE,
               'R', 'Savings/Current',
               'F', 'Fixed Deposit',
               'C', 'Recuring Deposit')
           DEP_NATURE,
       pt.point_name,
       (SELECT CATEGORY_NAME
          FROM EMOB.ST_POINT_CATEGORY CP
         WHERE CP.point_category_id = pt.POINT_CATEGORY_ID)
           POINT_CATEGORY,
       DECODE (pt.LOCATION_TYPE,  'U', 'Urban',  'R', 'Rural')
           LOCATION_TYPE,
       (SELECT DISTRICT_NAME
          FROM EMOB.DISTRICT_INFO d
         WHERE d.district_code = pt.district_CODE)
           DISTRICT
  FROM EMOB.mb_account_daily_balance  b,
       emob.mb_account_mst                 a,
       emob.mb_customer_mst                c,
       emob.mb_product_mst                 p,
       EMOB.ST_AGENT_POINT                 pt
 WHERE     a.ac_id = b.ac_id
       AND A.CUST_NO = C.CUST_NO
       AND a.ac_type_id = p.ac_type_id
       AND a.point_id = pt.point_id(+)"
  }
}

filter {
  mutate {
    id => "lineage_loaded_at"
    copy => { "@timestamp" => "etl_loaded_at" }
  }
  mutate {
    id => "lineage_pipeline"
    add_field => { "etl_pipeline" => "ac_balance_data" }
    remove_field => ["@version"]
  }

  # Time filter in Kibana follows the business date. Load time stays in etl_loaded_at.
  # The JDBC input already returns a timestamp, so copy it. The date filter ignores non-strings.
  if [balance_date] {
    mutate {
      id => "business_timestamp"
      copy => { "balance_date" => "@timestamp" }
    }
  }

  # A missing key would otherwise become the literal ID "%{...}" and overwrite one document repeatedly.
  if [ac_id] and [balance_date] {
    mutate {
      id => "doc_id"
      add_field => { "[@metadata][doc_id]" => "%{[ac_id]}_%{[balance_date]}" }
    }
  } else {
    mutate {
      id => "tag_missing_id"
      add_tag => ["_missing_doc_id"]
    }
  }
}

output {
  if "_missing_doc_id" in [tags] {
    file {
      id => "rejects_ac_balance_data"
      path => "rejects/ac_balance_data.ndjson"
      codec => json_lines
    }
  } else {
    elasticsearch {
      id => "es_ac_balance_data"
      hosts => ["${ES_HOSTS:https://10.11.200.109:9200}"]
      user => "${ES_USER:elastic}"
      password => "${ES_PASSWORD}"
      ssl => true
      cacert => "${ES_CA_CERT:../../ca/ca.crt}"
      index => "ac_balance_data"
      action => "index"
      document_id => "%{[@metadata][doc_id]}"
      data_stream => false
      ilm_enabled => false
      manage_template => true
      template => "templates/ac_balance_data.json"
      template_name => "ac_balance_data"
      template_overwrite => true
      # A slow bulk on a 2 GB heap should queue, not time out and resend.
      timeout => 120
      retry_max_interval => 30
    }
  }
}
