# Customer and account master
# Target index: customer_data    Document ID: ac_no (verified unique on dev)
# Full load: reads once and stops. Re-running is safe because document IDs are deterministic.
# SQL change: removed the OPEN_DATE range filter.

input {
  jdbc {
    id => "jdbc_customer_data"
    jdbc_driver_library => "${LS_ROOT:.}/drivers/ojdbc8-21.1.0.0.jar"
    jdbc_driver_class => "Java::oracle.jdbc.driver.OracleDriver"
    # ENABLE=BROKEN turns on TCP keepalive, so a dead database connection is detected during a long read.
    jdbc_connection_string => "${ORACLE_JDBC_URL:jdbc:oracle:thin:@(DESCRIPTION=(ENABLE=BROKEN)(RETRY_COUNT=3)(RETRY_DELAY=5)(TRANSPORT_CONNECT_TIMEOUT=10)(CONNECT_TIMEOUT=30)(ADDRESS=(PROTOCOL=TCP)(HOST=10.11.200.37)(PORT=1521))(CONNECT_DATA=(SERVICE_NAME=emob)))}"
    # Both come from the Logstash keystore.
    jdbc_user => "${ORACLE_USER}"
    jdbc_password => "${ORACLE_PASSWORD}"
    jdbc_validate_connection => true
    connection_retry_attempts => 5
    connection_retry_attempts_wait_time => 30
    # Oracle's driver default is 10 rows per network round trip.
    jdbc_fetch_size => 1000
    # Oracle DATE has no time zone. The dev database session runs at +06:00.
    jdbc_default_timezone => "Asia/Dhaka"
    # No sql_last_value in this query, so there is no run state to keep.
    record_last_run => false
    statement => "SELECT 'ABS' SRC, 'C' CON_ISL,C.CUST_NO,
       C.CUST_CODE,
       DECODE (C.CUST_TYPE,  'CUS', 'Customer',  'AGN', 'Agent')
           CUSTOMER_TYPE,
       C.CUST_TYPE,
       C.FIRST_NAME,
       C.LAST_NAME,
       C.FATHER_NAME,
       C.MOTHER_NAME,
       C.CUST_DOB,
       DECODE(C.GENDER,'M','Male','F','Female') GENDR,
       C.GENDER,
       DECODE(c.maritual_status,'SNG','Single','MAR','Married') Mar_status,
       c.maritual_status,
       C.SPOUSE_NAME,
       c.no_of_children,
       c.aml_sts,
       c.token_no,
       c.aml_sending_date,
       c.no_of_dependant,
       c.mail_id,
       c.other_bank,
       c.other_bank_acc_no,
       c.income_person,
       c.income_male,
       c.income_female,
       c.relation_with_guardian,
       c.check_by,
       c.check_date,
       c.remark,
       C.SON,
       C.DAUGHTER,
       C.MOBILE_NO,
       C.RELIGIOUS_CODE,
       C.OCCUPATION_CODE,
       (SELECT CODDES FROM EMOB.STCODMAS WHERE HARCOD='OCC' AND SOFCOD=C.OCCUPATION_CODE) OCCUPATION,
       C.ANNUAL_INCOME,
       C.CUST_STATUS,
       C.MEDIA,
       C.LIVE_PERIOD,
       C.HOME_TYPE,
       C.LAST_EDUCATION,
       (SELECT CODDES FROM EMOB.STCODMAS WHERE HARCOD='EDT' AND SOFCOD=C.LAST_EDUCATION) EDUCATION,
       C.FAMILY_GUARDIAN,
       C.CREATE_BY,
       C.REVIEW_STATUS,
       (SELECT json_arrayagg (
                   json_object ('document_id' VALUE DOCUMENT_ID,
                                'document_type' VALUE DOCUMENT_TYPE,
                                'document_no' VALUE DOCMENT_NO,
                                'issue_date' VALUE ISSUE_DATE,
                                'issue_place' VALUE ISSUE_PLACE,
                                'expire_date' VALUE EXPIRE_DATE,
                                'create_by' VALUE CREATE_BY,
                                'create_date' VALUE CREATE_DATE))
          FROM EMOB.MB_DOCUMENT_MST
         WHERE CUST_NO = C.CUST_NO)
           DOC,
       (SELECT json_arrayagg (
                   json_object ('address_id' VALUE a.address_id,
                                'address_type' VALUE a.address_type,
                                'district' VALUE d.district_name,
                                'upazilla' VALUE u.upazila_name,
                                'union' VALUE un.union_name,
                                'post_code' VALUE a.post_code,
                                'village' VALUE a.village,
                                'ward' VALUE a.ward_no,
                                'road_no' VALUE a.road_no,
                                'holding_no' VALUE a.holding_no,
                                'create_date' VALUE a.CREATE_DATE,
                                'create_by' VALUE a.CREATE_by))    Address
          FROM EMOB.MB_ADDRESS_MST  a,
               emob.district_info   d,
               emob.upazila_info    u,
               emob.union_info      un
         WHERE     a.ref_NO = C.CUST_NO
               AND a.district_code = d.district_code
               AND d.district_code = u.district_code
               AND un.district_code = d.district_code
               AND un.upazila_code = u.upazila_code
               AND a.upazila_code = u.upazila_code
               AND a.union_code = un.union_code)
           Address,
           (SELECT  json_arrayagg(json_object ('ac_id' VALUE op.AC_ID,
                    'cust_no' VALUE op.cust_no,
                    'name' VALUE cs.first_name||' '||cs.last_name,
                    'status' VALUE   op.status,
                    'create_by' VALUE op.create_by,
                    'inactive_by' VALUE op.inactive_by,
                   'inactive_date' VALUE op.inactive_date,
                    'create_date' VALUE op.CREATE_DATE)) operator
  FROM EMOB.MB_ACCOUNT_OPERATOR op,emob.mb_customer_mst cs
  WHERE op.ac_id=A.AC_ID
  AND cs.cust_no=op.CUST_NO
) OPERATOR,
 (SELECT  json_arrayagg(json_object ('nominee_id' VALUE nm.nominee_id,
                    'ac_id' VALUE nm.ac_id,
                    'nominee_name' VALUE nm.nominee_name,
                    'father_name' VALUE   nm.father_name,
                    'mother_name' VALUE nm.mother_name,
                    'relation' VALUE nm.relation,
                   'nom_percent' VALUE nm.nom_percent,
                    'nom_type' VALUE nm.nom_type,
                     'docment_no' VALUE nm.docment_no,
                      'dob' VALUE nm.dob,
                    'document_type' VALUE nm.document_type) returning clob) nominee
  FROM EMOB.nominee_mst nm
  WHERE nm.AC_ID=A.AC_ID
) NOMINEE,
       C.AGN_TYPE,
       C.REF_AGN,
       C.AGENT_POINT_ID,
       F.POINT_NAME,
       F.AREA_NAME,
       (SELECT CATEGORY_NAME FROM EMOB.ST_POINT_CATEGORY CP WHERE CP.point_category_id=F.POINT_CATEGORY_ID) POINT_CATEGORY,
       DECODE(F.LOCATION_TYPE,'U','Urban','R','Rural') LOCATION_TYPE,
       A.BRANCH_CODE,
       A.AC_TYPE_ID,
       p.full_desc,
       P.SHORT_DESC,
       P.DEP_NATURE,
       p.ac_type,
       p.nature,
       A.AC_ID,
       A.AC_NO,
       A.AC_TITLE,
       A.OPEN_DATE,
       A.CLOSE_DATE,
       A.ALLTRN,
       A.SECTOR_CODE,
       A.SECURITY_CODE,
       A.ECONOMY_CODE,
       a.comp_type,
       a.debit_enable_by,
       a.debit_enable_date,
       a.initial_amt,
       A.AC_STATUS,
       A.CREATE_BY AC_CREATE_BY,
       A.CREATE_DATE,
       A.FINAL_CHECK,
       A.FINAL_CHECK_DATE,
       A.AC_NATURE,
       DECODE(A.AC_NATURE,'S','Single','J','Joint','C','Company') ACCOUNT_NATURE,
       A.OPR_INS,
       (SELECT INS_DESC FROM EMOB.ST_OPERATING_INSTRUCTION SO WHERE SO.OPR_INS=A.OPR_INS) OPERATING_INS,
       A.CLOSE_BY,
       A.LIEN_MARK,
       A.POINT_ID AC_POINT_ID,
       A.EKYC_TYPE
  FROM EMOB.MB_ACCOUNT_MST   A,
       EMOB.MB_CUSTOMER_MST  C,
       EMOB.ST_AGENT_POINT   F,
       EMOB.MB_PRODUCT_MST   P
 WHERE     A.CUST_NO = C.CUST_NO
       AND C.AGENT_POINT_ID = F.POINT_ID(+)
       AND A.POINT_ID = F.POINT_ID(+)
       AND A.AC_TYPE_ID = P.AC_TYPE_ID"
  }
}

filter {
  mutate {
    id => "lineage_loaded_at"
    copy => { "@timestamp" => "etl_loaded_at" }
  }
  mutate {
    id => "lineage_pipeline"
    add_field => { "etl_pipeline" => "customer_data" }
    remove_field => ["@version"]
  }

  # Time filter in Kibana follows the business date. Load time stays in etl_loaded_at.
  # The JDBC input already returns a timestamp, so copy it. The date filter ignores non-strings.
  if [create_date] {
    mutate {
      id => "business_timestamp"
      copy => { "create_date" => "@timestamp" }
    }
  }

  # JSON_ARRAYAGG columns arrive as strings. Parse them into real arrays of objects.
  if [doc] {
    json {
      id => "parse_doc"
      source => "doc"
      target => "doc"
    }
  }
  if [address] {
    json {
      id => "parse_address"
      source => "address"
      target => "address"
    }
  }
  if [operator] {
    json {
      id => "parse_operator"
      source => "operator"
      target => "operator"
    }
  }
  if [nominee] {
    json {
      id => "parse_nominee"
      source => "nominee"
      target => "nominee"
    }
  }

  # JSON_OBJECT renders DATE as local time with no offset, and Elasticsearch would read that as
  # UTC, 6 hours away from the top-level dates. Add the offset so all dates are the same instant.
  if "_jsonparsefailure" not in [tags] {
    ruby {
      id => "nested_date_offset"
      code => '
        { "doc" => %w[issue_date expire_date create_date],
          "address" => %w[create_date],
          "operator" => %w[inactive_date create_date],
          "nominee" => %w[dob] }.each do |field, dates|
          rows = event.get(field)
          next unless rows.is_a?(Array)
          rows.each { |row| dates.each { |d| row[d] = "#{row[d]}+06:00" if row[d] } }
          event.set(field, rows)
        end
      '
    }
  }

  # A missing key would otherwise become the literal ID "%{...}" and overwrite one document repeatedly.
  if [ac_no] {
    mutate {
      id => "doc_id"
      add_field => { "[@metadata][doc_id]" => "%{[ac_no]}" }
    }
  } else {
    mutate {
      id => "tag_missing_id"
      add_tag => ["_missing_doc_id"]
    }
  }
}

output {
  if "_missing_doc_id" in [tags] or "_jsonparsefailure" in [tags] {
    file {
      id => "rejects_customer_data"
      path => "rejects/customer_data.ndjson"
      codec => json_lines
    }
  } else {
    elasticsearch {
      id => "es_customer_data"
      hosts => ["${ES_HOSTS:http://10.11.200.109:9200}"]
      index => "customer_data"
      action => "index"
      document_id => "%{[@metadata][doc_id]}"
      data_stream => false
      ilm_enabled => false
      manage_template => true
      template => "templates/customer_data.json"
      template_name => "customer_data"
      template_overwrite => true
      # A slow bulk on a 2 GB heap should queue, not time out and resend.
      timeout => 120
      retry_max_interval => 30
    }
  }
}
