# Single-node Elasticsearch 8.4.3 + Kibana 8.4.3.
# Usage: docker compose up -d      (Podman: podman compose up -d)
# Override with env vars or a .env file: ES_PORT, KIBANA_PORT, ES_HEAP, ES_MEM_LIMIT
# Security is DISABLED (no login, plain HTTP) - keep these ports off untrusted networks.
# On a Linux host, Elasticsearch needs: sysctl -w vm.max_map_count=262144
name: elastic

services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.4.3
    container_name: elasticsearch
    restart: unless-stopped
    environment:
      discovery.type: single-node
      cluster.name: era-es
      xpack.security.enabled: "false"
      bootstrap.memory_lock: "true"
      ES_JAVA_OPTS: -Xms${ES_HEAP:-8g} -Xmx${ES_HEAP:-8g}
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    cpus: 4
    mem_limit: ${ES_MEM_LIMIT:-12g}
    ports:
      - "${ES_PORT:-9200}:9200"
    volumes:
      - es-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s' >/dev/null"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 30s

  kibana:
    image: docker.elastic.co/kibana/kibana:8.4.3
    container_name: kibana
    restart: unless-stopped
    depends_on:
      elasticsearch:
        condition: service_healthy
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
      SERVER_NAME: kibana
      NODE_OPTIONS: --max-old-space-size=1024
    cpus: 2
    mem_limit: 2g
    ports:
      - "${KIBANA_PORT:-5601}:5601"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:5601/api/status >/dev/null"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 40s

volumes:
  es-data:
