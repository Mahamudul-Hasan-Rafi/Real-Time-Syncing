# Single-node Elasticsearch 8.4.3 + Kibana 8.4.3 with security ON: password login and HTTPS (TLS) on port 9200.
# Usage: docker compose up -d      (Podman: podman compose up -d)
# Required in .env (copy .env.example): ES_PASSWORD (login "elastic"), KIBANA_PASSWORD, ES_HOST_IP (this machine's IP).
# Override with env vars or a .env file: ES_PORT, KIBANA_PORT, ES_HEAP, ES_MEM_LIMIT
#
# TLS: the one-shot `certs` service creates a private CA and a server certificate (valid for elasticsearch, localhost,
# 127.0.0.1 and ES_HOST_IP) in the `es-certs` volume, once. Clients trust the CA file it copies to ./ca/ca.crt.
# If ES_HOST_IP changes, delete the certificates and start again:  docker compose down -v   (this also deletes the data).
# On a Linux host, Elasticsearch needs: sysctl -w vm.max_map_count=262144
name: elastic

services:
  certs:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.4.3
    container_name: elastic-certs
    user: "0"
    restart: "no"
    volumes:
      - es-certs:/usr/share/elasticsearch/config/certs
      - ./ca:/ca-out:z                       # receives the public CA certificate (ca.crt) for the clients
    command:
      - bash
      - -c
      - |
        set -e
        cd /usr/share/elasticsearch
        if [ ! -f config/certs/ca.zip ]; then
          bin/elasticsearch-certutil ca --silent --pem -out config/certs/ca.zip
          unzip -q config/certs/ca.zip -d config/certs
        fi
        if [ ! -f config/certs/certs.zip ]; then
          printf 'instances:\n  - name: elasticsearch\n    dns: [elasticsearch, localhost]\n    ip: [127.0.0.1, ${ES_HOST_IP:?set ES_HOST_IP in Packages/cdc/elastic/.env (this machine IP)}]\n' > config/certs/instances.yml
          bin/elasticsearch-certutil cert --silent --pem -out config/certs/certs.zip --in config/certs/instances.yml --ca-cert config/certs/ca/ca.crt --ca-key config/certs/ca/ca.key
          unzip -q config/certs/certs.zip -d config/certs
        fi
        cp config/certs/ca/ca.crt /ca-out/ca.crt
        chmod 644 /ca-out/ca.crt
        chown -R root:root config/certs
        find config/certs -type d -exec chmod 750 {} \;
        find config/certs -type f -exec chmod 640 {} \;
        echo "certificates ready"

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.4.3
    container_name: elasticsearch
    restart: unless-stopped
    depends_on:
      certs:
        condition: service_completed_successfully
    environment:
      discovery.type: single-node
      cluster.name: era-es
      ELASTIC_PASSWORD: ${ES_PASSWORD:?set ES_PASSWORD in Packages/cdc/elastic/.env (password of the elastic user)}
      xpack.security.enabled: "true"
      xpack.security.http.ssl.enabled: "true"
      xpack.security.http.ssl.key: certs/elasticsearch/elasticsearch.key
      xpack.security.http.ssl.certificate: certs/elasticsearch/elasticsearch.crt
      xpack.security.http.ssl.certificate_authorities: certs/ca/ca.crt
      xpack.security.transport.ssl.enabled: "true"
      xpack.security.transport.ssl.verification_mode: certificate
      xpack.security.transport.ssl.key: certs/elasticsearch/elasticsearch.key
      xpack.security.transport.ssl.certificate: certs/elasticsearch/elasticsearch.crt
      xpack.security.transport.ssl.certificate_authorities: certs/ca/ca.crt
      bootstrap.memory_lock: "true"
      ES_JAVA_OPTS: -Xms${ES_HEAP:-8g} -Xmx${ES_HEAP:-8g}
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    cpus: 4
    mem_limit: ${ES_MEM_LIMIT:-12g}
    ports:
      - "${ES_PORT:-9200}:9200"
    volumes:
      - es-data:/usr/share/elasticsearch/data
      - es-certs:/usr/share/elasticsearch/config/certs:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -sf --cacert config/certs/ca/ca.crt -u \"elastic:$$ELASTIC_PASSWORD\" 'https://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s' >/dev/null"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 30s

  # One-shot: sets the password of the built-in kibana_system user, which Kibana uses to talk to Elasticsearch.
  security-init:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.4.3
    container_name: elastic-security-init
    restart: "no"
    depends_on:
      elasticsearch:
        condition: service_healthy
    volumes:
      - es-certs:/usr/share/elasticsearch/config/certs:ro
    environment:
      ELASTIC_PASSWORD: ${ES_PASSWORD}
      KIBANA_PASSWORD: ${KIBANA_PASSWORD:?set KIBANA_PASSWORD in Packages/cdc/elastic/.env (password of the kibana_system user)}
    command:
      - bash
      - -c
      - |
        set -e
        curl -sf -X POST --cacert config/certs/ca/ca.crt -u "elastic:$$ELASTIC_PASSWORD" \
          -H 'Content-Type: application/json' \
          https://elasticsearch:9200/_security/user/kibana_system/_password \
          -d "{\"password\":\"$$KIBANA_PASSWORD\"}"
        echo
        echo "kibana_system password set"

  kibana:
    image: docker.elastic.co/kibana/kibana:8.4.3
    container_name: kibana
    restart: unless-stopped
    depends_on:
      elasticsearch:
        condition: service_healthy
      security-init:
        condition: service_completed_successfully
    environment:
      ELASTICSEARCH_HOSTS: https://elasticsearch:9200
      ELASTICSEARCH_USERNAME: kibana_system
      ELASTICSEARCH_PASSWORD: ${KIBANA_PASSWORD}
      ELASTICSEARCH_SSL_CERTIFICATEAUTHORITIES: /usr/share/kibana/config/certs/ca/ca.crt
      SERVER_NAME: kibana
      NODE_OPTIONS: --max-old-space-size=1024
    volumes:
      - es-certs:/usr/share/kibana/config/certs:ro
    cpus: 2
    mem_limit: 2g
    ports:
      - "${KIBANA_PORT:-5601}:5601"
    healthcheck:
      test: ["CMD-SHELL", "curl -s -I http://localhost:5601 | grep -qE 'HTTP/1.1 (200|302)'"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 40s

volumes:
  es-data:
  es-certs:
